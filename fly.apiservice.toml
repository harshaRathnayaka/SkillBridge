app = "skillbridge-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.apiservice"

[env]
  ConnectionStrings__SkillBridgeDb = "Data Source=/data/skillbridge.db"

[[mounts]]
  source = "skillbridge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
